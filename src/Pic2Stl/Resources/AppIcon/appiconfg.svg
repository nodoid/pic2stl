<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- A photo extruded into a solid slab: the photo is the front face, the solid is what gets printed. -->
    <defs>
        <clipPath id="photo">
            <rect x="110" y="158" width="196" height="152" />
        </clipPath>
    </defs>

    <!-- Solid sides -->
    <path d="M306 158 L350 128 L350 280 L306 310 Z" fill="#3E5BB8" />
    <path d="M110 158 L154 128 L350 128 L306 158 Z" fill="#8FA6FF" />

    <!-- Photo front face -->
    <rect x="110" y="158" width="196" height="152" fill="#EEF2FF" />
    <g clip-path="url(#photo)">
        <circle cx="160" cy="208" r="21" fill="#4ADEA9" />
        <path d="M104 320 L172 236 L214 282 L248 238 L312 320 Z" fill="#6C8CFF" />
        <path d="M104 320 L172 236 L196 266 L162 320 Z" fill="#4A6BE0" />
    </g>
</svg>
